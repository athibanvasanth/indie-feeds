name: Generate RSS Feed

on:
  schedule:
    - cron: "0 * * * *"
    - cron: "15 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preserve existing feeds
        continue-on-error: true
        run: |
          mkdir -p public
          for f in feed.xml index.html caravan.xml; do
            curl -sf "https://athibanvasanth.github.io/indie-feeds/$f" -o "public/$f" && echo "Preserved existing $f" || echo "No existing $f to preserve"
          done

      - name: Generate Wire feeds
        continue-on-error: true
        run: python generate_feed.py
        env:
          BASE_URL: ${{ vars.BASE_URL }}

      - name: Generate Caravan feed
        continue-on-error: true
        run: python generate_caravan_feed.py
        env:
          BASE_URL: ${{ vars.BASE_URL }}

      - name: Preserve existing digest
        continue-on-error: true
        run: |
          mkdir -p public
          curl -sf "https://athibanvasanth.github.io/indie-feeds/digest.html" -o public/digest.html && echo "Preserved existing digest.html" || echo "No existing digest to preserve"

      - name: Generate Daily Digest
        if: github.event.schedule == '15 1 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python generate_digest.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
